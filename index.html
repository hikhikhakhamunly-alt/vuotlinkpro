
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINKBYPASS PRO</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #090b18;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  padding: 22px;
  border-bottom: 1px solid #30264b;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 23px;
  font-weight: 900;
  color: #b78aff;
}

.status {
  color: #65e6aa;
  font-size: 12px;
}

main {
  max-width: 850px;
  margin: 75px auto;
  padding: 20px;
}

.hero {
  text-align: center;
  margin-bottom: 35px;
}

.hero h1 {
  font-size: clamp(32px, 7vw, 55px);
  margin-bottom: 15px;
}

.hero span {
  color: #ae83ff;
}

.hero p {
  color: #aaa7c2;
  line-height: 1.7;
}

.panel {
  background: #15162b;
  border: 1px solid #49366e;
  border-radius: 20px;
  padding: 28px;
}

label {
  display: block;
  margin-bottom: 13px;
  font-weight: bold;
}

.input-group {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid #514477;
  background: #0c1020;
  color: white;
  outline: none;
}

input:focus {
  border-color: #a77aff;
}

button {
  border: none;
  cursor: pointer;
  border-radius: 12px;
  font-weight: bold;
}

#checkBtn {
  padding: 0 22px;
  background: linear-gradient(120deg,#a45aff,#6338e8);
  color: white;
}

#checkBtn:disabled {
  opacity: .6;
}

#result {
  display: none;
  margin-top: 22px;
  padding: 18px;
  border-radius: 12px;
  background: #0c1020;
  overflow-wrap: anywhere;
}

#result.show {
  display: block;
}

#result a {
  display: block;
  color: #bd9bff;
  margin-top: 12px;
  word-break: break-all;
}

#result p {
  margin-top: 10px;
  color: #c3bfd4;
}

.copy-btn {
  margin-top: 15px;
  padding: 12px 18px;
  color: white;
  background: #35245a;
}

.note {
  margin-top: 22px;
  color: #9995b0;
  font-size: 12px;
  line-height: 1.7;
}

footer {
  text-align: center;
  padding: 25px;
  color: #77738e;
  font-size: 12px;
}

@media(max-width:600px) {
  .input-group {
    flex-direction: column;
  }

  #checkBtn {
    padding: 15px;
  }

  main {
    margin-top: 35px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">LINKBYPASS PRO</div>
  <div class="status">● API CONNECT</div>
</header>

<main>
  <section class="hero">
    <h1>LINK <span>BYPASS PRO</span></h1>
    <p>Công cụ kiểm tra liên kết và chuyển hướng HTTP.</p>
  </section>

  <section class="panel">
    <form id="linkForm">
      <label for="linkInput">🔗 DÁN LINK CỦA BẠN</label>

      <div class="input-group">
        <input
          id="linkInput"
          type="url"
          placeholder="https://example.com/"
          required
        >

        <button id="checkBtn" type="submit">
          KIỂM TRA
        </button>
      </div>
    </form>

    <div id="result" aria-live="polite"></div>

    <div class="note">
      Công cụ kiểm tra chuyển hướng HTTPS thông thường.
      Không vượt CAPTCHA, đăng nhập, thanh toán hoặc
      quảng cáo bắt buộc.
    </div>
  </section>
</main>

<footer>
  LINKBYPASS PRO © 2026
</footer>
<script>
const API_BASE =
"https://linkbypass-pro-api.hikhikhakhamunly.workers.dev";

const form = document.getElementById("linkForm");
const input = document.getElementById("linkInput");
const button = document.getElementById("checkBtn");
const result = document.getElementById("result");

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  let url;

  try {
    url = new URL(input.value.trim());

    if (url.protocol !== "https:") {
      throw new Error("Chỉ hỗ trợ link HTTPS.");
    }
  } catch (error) {
    result.className = "show";
    result.textContent = error.message || "Link không hợp lệ.";
    return;
  }

  button.disabled = true;
  button.textContent = "ĐANG KIỂM TRA...";

  result.className = "show";
  result.textContent = "Đang kết nối Cloudflare...";

  try {
    const response = await fetch(
      API_BASE + "/api/resolve",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          url: url.href
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(data.error || "Không thể xử lý link.");
    }

    result.replaceChildren();

    const title = document.createElement("h3");
    title.textContent = "✓ KIỂM TRA THÀNH CÔNG";

    const finalLink = document.createElement("a");
    finalLink.href = data.finalUrl;
    finalLink.target = "_blank";
    finalLink.rel = "noopener noreferrer";
    finalLink.textContent = data.finalUrl;

    const count = document.createElement("p");
    count.textContent =
      "Số lần chuyển hướng: " +
      (data.redirects?.length ?? 0);

    const copy = document.createElement("button");
    copy.className = "copy-btn";
    copy.textContent = "SAO CHÉP LINK CUỐI";

    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(data.finalUrl);
        copy.textContent = "ĐÃ SAO CHÉP ✓";
      } catch {
        copy.textContent = "KHÔNG THỂ SAO CHÉP";
      }
    };

    result.append(title, finalLink, count, copy);

  } catch (error) {
    result.replaceChildren();

    const message = document.createElement("p");
    message.textContent = "Lỗi: " + error.message;

    result.append(message);
    result.className = "show";

  } finally {
    button.disabled = false;
    button.textContent = "KIỂM TRA";
  }
});
</script>
</body>
</html>
